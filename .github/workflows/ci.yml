name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest

    # test:db builds a throwaway database from the real migration files
    # against a plain PostgreSQL server (tests/db/global-setup.ts) -- no
    # Supabase CLI/Docker stack needed for that. test:api needs the full
    # local Supabase stack (Data API + Auth) and is self-skipping
    # (describe.skipIf) when SUPABASE_API_TEST_URL is unset, which it is
    # here -- same as running `npm test` locally without `supabase start`.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci

      - run: npm run check
